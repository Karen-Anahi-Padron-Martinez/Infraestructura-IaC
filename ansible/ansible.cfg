[defaults]
inventory = inventario.ini
roles_path = roles
# En el contenedor la llave está en /root/.ssh/id_gestor (el inventario de Terraform trae la ruta de Windows)
private_key_file = /root/.ssh/id_gestor
vault_password_file = /root/.vault_pass
stdout_callback = default
result_format = yaml
retry_files_enabled = False
interpreter_python = /usr/bin/python3

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

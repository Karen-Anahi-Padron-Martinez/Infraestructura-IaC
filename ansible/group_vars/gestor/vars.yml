# Variables del grupo "gestor". Los secretos van cifrados en vault.yml (Ansible Vault).
zona_horaria: America/Mexico_City

usuario_despliegue: "{{ ansible_user }}"
dir_app: /opt/gestor

# Imágenes publicadas por el pipeline en GitHub Container Registry
registro: ghcr.io/karen-anahi-padron-martinez
# Versiones a desplegar: el pipeline pasa -e api_tag=<build> o -e cliente_tag=<build>.
# Si no se indican, el rol app conserva la versión que ya está desplegada (o "latest" la primera vez).

# El cliente web se publica en el puerto 80 (abierto en el NSG de Terraform)
cliente_puerto: 80
cliente_url: "http://{{ fqdn_publico }}"

# Scripts SQL de Microservicio-BD (montados en el contenedor de Ansible en /bd-sql)
bd_sql_origen: /bd-sql/

db_usuario: gestor
db_password: "{{ vault_db_password }}"
db_root_password: "{{ vault_db_root_password }}"

# Monitoreo (Grafana publicado en 3000, limitado por el NSG a cidrs_admin)
dir_monitoreo: /opt/monitoreo
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Trazas: agente Java de OpenTelemetry (versión fijada y verificada por SHA-256)
otel_agente_version: "2.34.0"
otel_agente_sha256: "da44154cea128257779c8a782b9651fd7c0c6aa177cd3810f9a867ac8509555d"

# Despliega la aplicación con Docker Compose y verifica que responda
- name: Crear directorios de la aplicación
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dir_app }}"
    - "{{ dir_app }}/sql"

- name: Directorio del agente OpenTelemetry
  ansible.builtin.file:
    path: "{{ dir_app }}/otel"
    state: directory
    mode: "0755"

- name: Descargar agente Java de OpenTelemetry (verificado con SHA-256)
  ansible.builtin.get_url:
    url: "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v{{ otel_agente_version }}/opentelemetry-javaagent.jar"
    dest: "{{ dir_app }}/otel/opentelemetry-javaagent.jar"
    checksum: "sha256:{{ otel_agente_sha256 }}"
    mode: "0644"

- name: Copiar scripts SQL de Microservicio-BD
  ansible.builtin.copy:
    src: "{{ bd_sql_origen }}"
    dest: "{{ dir_app }}/sql/"
    mode: "0644"

- name: Copiar docker-compose.yml (mismo archivo que se prueba en local)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../despliegue/docker-compose.yml"
    dest: "{{ dir_app }}/docker-compose.yml"
    mode: "0644"

- name: Leer las versiones desplegadas actualmente (si existe un .env previo)
  ansible.builtin.slurp:
    src: "{{ dir_app }}/.env"
  register: env_actual
  failed_when: false
  no_log: true

- name: Calcular versiones a desplegar (la indicada por el pipeline o la que ya estaba)
  ansible.builtin.set_fact:
    api_tag_efectivo: "{{ api_tag | default(_actual.API_TAG | default('latest')) }}"
    cliente_tag_efectivo: "{{ cliente_tag | default(_actual.CLIENTE_TAG | default('latest')) }}"
  vars:
    _lineas: "{{ (env_actual.content | default('') | b64decode).splitlines() | select('search', '^(API|CLIENTE)_TAG=') | list }}"
    _claves: "{{ _lineas | map('regex_replace', '=.*$', '') | list }}"
    _valores: "{{ _lineas | map('regex_replace', '^[^=]*=', '') | list }}"
    _actual: "{{ dict(_claves | zip(_valores)) }}"

- name: Versiones elegidas
  ansible.builtin.debug:
    msg: "api={{ api_tag_efectivo }} cliente={{ cliente_tag_efectivo }}"

- name: Generar .env con los secretos de Ansible Vault (solo legible por root)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dir_app }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Descargar imágenes y levantar los servicios
  ansible.builtin.command:
    cmd: docker compose up -d --pull always --remove-orphans
    chdir: "{{ dir_app }}"
  register: compose_up
  # "Pulled" aparece aunque la imagen no cambie; solo hay cambio real si un contenedor se crea, recrea o inicia
  changed_when: compose_up.stderr is search('Started|Recreated|Created')

- name: Esperar a que el cliente esté healthy (health check interno en el puerto de administración 8090)
  ansible.builtin.command:
    cmd: docker compose ps cliente --format "{{ '{{' }}.Health{{ '}}' }}"
    chdir: "{{ dir_app }}"
  register: salud
  until: salud.stdout == 'healthy'
  retries: 30
  delay: 10
  changed_when: false

- name: La página de login responde en el puerto público
  ansible.builtin.uri:
    url: "http://localhost:{{ cliente_puerto }}/login"
    status_code: 200

- name: Regresión de seguridad - Actuator no debe estar expuesto en el puerto público (CWE-200)
  ansible.builtin.uri:
    url: "http://localhost:{{ cliente_puerto }}/actuator/prometheus"
    status_code: 404

- name: Prueba de humo - login con la cuenta demo (cliente -> API -> MariaDB)
  ansible.builtin.uri:
    url: "http://localhost:{{ cliente_puerto }}/verificarLogin"
    method: POST
    body_format: json
    body:
      correo_electronico: demo1@example.com
      contrasena: "Demo2026!"
    return_content: true
  register: login
  failed_when: login.status != 200 or login.json.nombre == '000'

- name: Estado de los contenedores
  ansible.builtin.command:
    cmd: docker compose ps --format "{{ '{{' }}.Service{{ '}}' }}={{ '{{' }}.Health{{ '}}' }}"
    chdir: "{{ dir_app }}"
  register: estado
  changed_when: false

- name: Resultado del despliegue
  ansible.builtin.debug:
    msg:
      - "Servicios: {{ estado.stdout_lines | join(', ') }}"
      - "Login demo: {{ login.json.nombre }}"
      - "Aplicación: {{ cliente_url }}"

- name: Limpiar imágenes antiguas sin uso
  ansible.builtin.command: docker image prune -f
  register: prune
  changed_when: "'Total reclaimed space: 0B' not in prune.stdout"

- name: Esperar a que la VM termine su arranque inicial (cloud-init)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Actualizar índice de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar paquetes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - unattended-upgrades
    state: present

- name: Activar actualizaciones automáticas de seguridad
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Consultar zona horaria actual
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: zona_actual
  changed_when: false

- name: Configurar zona horaria
  ansible.builtin.command: timedatectl set-timezone {{ zona_horaria }}
  when: zona_actual.stdout != zona_horaria
  changed_when: true

- name: Endurecer SSH (sin root ni contraseñas)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-gestor.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: "0644"
  notify: Validar y recargar ssh

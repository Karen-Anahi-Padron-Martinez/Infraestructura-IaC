- name: Recargar Prometheus
  # --web.enable-lifecycle permite recargar reglas y objetivos sin reiniciar el contenedor
  ansible.builtin.uri:
    url: http://localhost:9090/-/reload
    method: POST
  register: recarga
  failed_when: false
  changed_when: recarga.status == 200

- name: Reiniciar Grafana
  # Grafana solo lee el provisioning de datasources al arrancar
  ansible.builtin.command:
    cmd: docker compose restart grafana
    chdir: "{{ dir_monitoreo }}"
  changed_when: true

groups:
  - name: disponibilidad
    rules:
      - alert: ServicioCaido
        expr: up{job=~"api|cliente"} == 0
        for: 1m
        labels:
          severidad: critica
        annotations:
          resumen: "El servicio {{ $labels.job }} no responde"
          descripcion: "Prometheus no puede leer las métricas de {{ $labels.instance }} desde hace más de 1 minuto."

      - alert: ContenedorReiniciado
        expr: increase(container_start_time_seconds{name=~"gestor-.*"}[10m]) > 0
        labels:
          severidad: aviso
        annotations:
          resumen: "El contenedor {{ $labels.name }} se reinició"
          descripcion: "Se detectó un reinicio en los últimos 10 minutos (posible caída o despliegue)."

  - name: aplicacion
    rules:
      - alert: TasaErrores5xxAlta
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job=~"api|cliente", status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count{job=~"api|cliente"}[5m])) > 0.05
        for: 2m
        labels:
          severidad: critica
        annotations:
          resumen: "Más del 5 % de errores 5xx en {{ $labels.job }}"
          descripcion: "Tasa de errores del servidor: {{ $value | humanizePercentage }}."

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95, sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"api|cliente", uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        labels:
          severidad: aviso
        annotations:
          resumen: "Latencia p95 mayor a 1 s en {{ $labels.job }}"
          descripcion: "p95 actual: {{ $value | humanizeDuration }}."

  - name: servidor
    rules:
      - alert: CPUAlta
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels:
          severidad: aviso
        annotations:
          resumen: "CPU del servidor por encima del 85 %"
          descripcion: "Uso de CPU: {{ $value | printf \"%.1f\" }} %."

      - alert: MemoriaAlta
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severidad: critica
        annotations:
          resumen: "Memoria del servidor por encima del 90 %"
          descripcion: "Uso de memoria: {{ $value | printf \"%.1f\" }} %."

      - alert: DiscoCasiLleno
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 10m
        labels:
          severidad: aviso
        annotations:
          resumen: "Disco del servidor por encima del 85 %"
          descripcion: "Uso de disco: {{ $value | printf \"%.1f\" }} %."

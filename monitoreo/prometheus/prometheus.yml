global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    entorno: azure

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Microservicios Spring Boot: Actuator en el puerto interno de administración 8090
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8090"]
        labels:
          servicio: api

  - job_name: cliente
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cliente:8090"]
        labels:
          servicio: cliente

  # Servidor (CPU, memoria, disco, red)
  - job_name: nodo
    static_configs:
      - targets: ["node-exporter:9100"]

  # Contenedores (CPU y memoria por contenedor)
  - job_name: contenedores
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
